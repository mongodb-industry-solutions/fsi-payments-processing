---
kind: pipeline
type: kubernetes
name: staging-combined

trigger:
  branch:
    - qa-automation-poc
  paths:
    exclude:
      - README.md
      - THIRD-PARTY-NOTICES.md
      - .gitignore
      - EXAMPLE.env
      - LICENSE
      - backend/data/**

steps:
  - name: generate-git-app-token
    image: alpine:latest
    environment:
      GIT_APP_ID:
        from_secret: git_app_id
      GIT_APP_PRIVATE_KEY:
        from_secret: git_app_private_key
    commands:
      - apk add --no-cache openssl jq curl
      - |
        set -euo pipefail

        echo "$GIT_APP_PRIVATE_KEY" > /tmp/key.pem
        chmod 600 /tmp/key.pem

        # Build JWT
        NOW=$(date +%s)
        HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')
        PAYLOAD=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((NOW-60)) $((NOW+540)) "$GIT_APP_ID" | openssl base64 -A | tr '+/' '-_' | tr -d '=')
        SIG=$(printf '%s' "$HEADER.$PAYLOAD" | openssl dgst -sha256 -sign /tmp/key.pem -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')
        JWT="$HEADER.$PAYLOAD.$SIG"

        # Get installation ID
        INSTALLATION_ID=$(curl -sf \
          -H "Authorization: Bearer $JWT" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${DRONE_REPO}/installation" \
          | jq -r .id)

        echo "Installation ID: $INSTALLATION_ID"

        # Get token — pipe DIRECTLY from curl to jq to file
        # No intermediate variable capture that Drone might mask/corrupt
        curl -sf -X POST \
          -H "Authorization: Bearer $JWT" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/app/installations/$INSTALLATION_ID/access_tokens" \
          | jq -r .token \
          | tr -d '\n' > .git-token
        echo "This is the PWD"  
        pwd
        ls -al
        rm /tmp/key.pem

        # Verify — check length without exposing content
        SIZE=$(wc -c < .git-token)
        FIRST=$(head -c 4 .git-token)
        echo "Token file: $SIZE bytes, starts with: $FIRST"

        if [ "$SIZE" -lt 30 ]; then
          echo "❌ Token too short"
          exit 1
        fi

        if [ "$FIRST" != "ghs_" ]; then
          echo "❌ Token doesn't start with 'ghs_'"
          exit 1
        fi

        echo "✅ Token generated correctly"
        
