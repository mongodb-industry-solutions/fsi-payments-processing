  - name: update-image-tag
    image: alpine/git:latest
    commands:
      - |
        set -euo pipefail
        # Read the app-generated token from the previous step
        GIT_TOKEN=$(cat .git-token)
        if [ -z "$GIT_TOKEN" ]; then
          echo "❌ .git-token is empty — check the generate-git-app-token step"
          exit 1
        fi
        #NEW_TAG="prod-${DRONE_COMMIT_SHA:0:7}-${DRONE_BUILD_NUMBER}"
        NEW_TAG="prod-${DRONE_COMMIT_SHA:0:7}-223"
        MANIFEST_FILE="environment/production.yaml"
        apk add --no-cache yq
        ENCODED_TOKEN=$(echo -n "x-access-token:$GIT_TOKEN" | base64)
        git config --global user.name  "CI[bot]"
        git config --global user.email "CI[bot]@users.noreply.github.com"

        # Use extraheader — sticks through clone AND push
        git config --global http.https://github.com "Authorization: Basic ${ENCODED_TOKEN}"
        #git config --global http.https://github.com/.extraheader Authorization: "Bearer $GIT_TOKEN"
        # ─── Clone with clean URL ───
        git clone https://github.com/${DRONE_REPO}.git repo
        cd repo
        git checkout ${DRONE_COMMIT_BRANCH}

        yq -i ".image.tag = \"${NEW_TAG}\"" $MANIFEST_FILE
        yq -i ".sidecarContainers[0].image = \"795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/fsi-payments-agent:${NEW_TAG}\"" $MANIFEST_FILE
        yq -i ".sidecarContainers[1].image = \"795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/fsi-payments-converter:${NEW_TAG}\"" $MANIFEST_FILE

        if git diff --quiet; then
          echo "No changes — image tag already up to date"
          cd ..
          rm -f .git-token
          exit 0
        fi
        COMMIT_MSG="ISTISO-13: Promote fsi-pp to latest staging tag [CI SKIP]"
        git add $MANIFEST_FILE
        git commit -m "$COMMIT_MSG"
        git push origin ${DRONE_COMMIT_BRANCH}
        # Cleanup
       # git config --global --unset http.https://github.com/.extraheader
        echo "✅ Pushed image tag update to ${DRONE_COMMIT_BRANCH}"
