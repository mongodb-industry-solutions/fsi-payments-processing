---
kind: pipeline
type: kubernetes
name: staging-combined

trigger:
  branch:
    - qa-automation-poc
  paths:
    exclude:
      - README.md
      - THIRD-PARTY-NOTICES.md
      - .gitignore
      - EXAMPLE.env
      - LICENSE
      - backend/data/**

steps:
  - name: generate-git-app-token
    image: alpine:latest
    environment:
      GIT_APP_ID:
        from_secret: git_app_id
      GIT_APP_PRIVATE_KEY:
        from_secret: git_app_private_key
    commands:
      - |
        set -e
        apk add --no-cache openssl jq curl

        # Save private key to a file
        echo "$GIT_APP_PRIVATE_KEY" > /tmp/private-key.pem

        # Build JWT
        NOW=$(date +%s)
        IAT=$((NOW - 60))
        EXP=$((NOW + 540))   # max 10 min

        HEADER=$(echo -n '{"alg":"RS256","typ":"JWT"}' \
          | openssl base64 -A | tr '+/' '-_' | tr -d '=')
        PAYLOAD=$(echo -n "{\"iat\":$IAT,\"exp\":$EXP,\"iss\":\"$GIT_APP_ID\"}" \
          | openssl base64 -A | tr '+/' '-_' | tr -d '=')
        SIG=$(echo -n "$HEADER.$PAYLOAD" \
          | openssl dgst -sha256 -sign /tmp/private-key.pem -binary \
          | openssl base64 -A | tr '+/' '-_' | tr -d '=')
        JWT="$HEADER.$PAYLOAD.$SIG"

        # Find installation ID for this repo
        INSTALLATION_ID=$(curl -s \
          -H "Authorization: Bearer $JWT" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${DRONE_REPO}/installation" \
          | jq -r '.id')

        if [ -z "$INSTALLATION_ID" ] || [ "$INSTALLATION_ID" = "null" ]; then
          echo "❌ Could not find installation ID — is the app installed on ${DRONE_REPO}?"
          exit 1
        fi

        # Exchange JWT for installation token
        INSTALLATION_TOKEN=$(curl -s -X POST \
          -H "Authorization: Bearer $JWT" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/app/installations/$INSTALLATION_ID/access_tokens" \
          | jq -r '.token')

        if [ -z "$INSTALLATION_TOKEN" ] || [ "$INSTALLATION_TOKEN" = "null" ]; then
          echo "❌ Failed to get installation token"
          exit 1
        fi

        # Write token to workspace file so next step can consume it
        echo "$INSTALLATION_TOKEN" > .git-token
        chmod 600 .git-token

        # Cleanup
        rm /tmp/private-key.pem

        echo "✅ Generated installation token (${#INSTALLATION_TOKEN} chars, valid 1 hour)"
        
