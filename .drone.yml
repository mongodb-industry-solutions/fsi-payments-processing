  - name: update-image-tag
    image: alpine/git:latest
    commands:
      - apk add --no-cache yq
      - |
        set -euo pipefail

        GIT_TOKEN=$(tr -d '[:space:]' < .git-token)
        SIZE=${#GIT_TOKEN}
        echo "Token size: $SIZE chars, prefix: ${GIT_TOKEN:0:4}"


        #NEW_TAG="prod-${DRONE_COMMIT_SHA:0:7}-${DRONE_BUILD_NUMBER}"
        NEW_TAG="prod-${DRONE_COMMIT_SHA:0:7}-223"
        
        MANIFEST_FILE="environment/production.yaml"
        echo "NEW_TAG: $NEW_TAG"
        REPO_URL="https://x-access-token:${GIT_TOKEN}@github.com/${DRONE_REPO}.git"
        echo "Token file size: $(wc -c < .git-token) bytes"
        git clone "https://x-access-token:$(cat .git-token)@github.com/${DRONE_REPO}.git" repo
        cd repo
        git remote set-url origin "https://x-access-token:$(cat .git-token)@github.com/${DRONE_REPO}.git"
        git config --global user.name  "CI[bot]"
        git config --global user.email "CI[bot]@users.noreply.github.com"
        git checkout ${DRONE_COMMIT_BRANCH}

        yq -i ".image.tag = \"${NEW_TAG}\"" $MANIFEST_FILE
        yq -i ".sidecarContainers[0].image = \"795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/fsi-payments-agent:${NEW_TAG}\"" $MANIFEST_FILE
        yq -i ".sidecarContainers[1].image = \"795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/fsi-payments-converter:${NEW_TAG}\"" $MANIFEST_FILE

        if git diff --quiet; then
          echo "No changes — image tag already up to date"
          cd ..
          rm -f .git-token
          exit 0
        fi

        COMMIT_MSG="ISTISO-13: Promote fsi-pp [CI SKIP]"
        git add $MANIFEST_FILE
        git commit -m "$COMMIT_MSG"
        git push origin ${DRONE_COMMIT_BRANCH}

        # Cleanup
        cd ..
        rm -f .git-token

        echo "✅ Pushed image tag update to ${DRONE_COMMIT_BRANCH}"
