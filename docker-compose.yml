services:
  converter:
    build:
      context: .
      dockerfile: Dockerfile.converter
    image: fsi-payments-converter:latest
    volumes:
      - ~/.aws/credentials:/root/.aws/credentials:ro
      - ~/.aws/config:/root/.aws/config:ro
      - ~/.aws/sso/cache:/root/.aws/sso/cache:rw
    ports:
      - "8001:8001"
    restart: always
    container_name: fsi-payments-converter

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: fsi-payments-agent:latest
    volumes:
      - ~/.aws/credentials:/root/.aws/credentials:ro
      - ~/.aws/config:/root/.aws/config:ro
      - ~/.aws/sso/cache:/root/.aws/sso/cache:rw
    ports:
      - "8002:8002"
    restart: always
    container_name: fsi-payments-agent

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: fsi-payments-frontend:latest
    ports:
      - "3000:8080"
    restart: always
    container_name: fsi-payments-frontend
    depends_on:
      - converter
      - agent
