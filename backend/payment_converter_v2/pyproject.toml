[project]
name = "payment-converter-v2"
version = "2.0.0"
description = "Simplified Generic Payment Format Converter with 3-Lane Processing"
authors = [{name = "FSI Payments Team", email = "team@example.com"}]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.4",
    "uvicorn>=0.32.0",
    "motor>=3.3.2",
    "pymongo>=4.10.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "boto3>=1.35.70",
    "botocore>=1.35.70",
    "python-dotenv>=1.0.1",
    "lxml>=5.1.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "config", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # Line too long (handled by formatter)

