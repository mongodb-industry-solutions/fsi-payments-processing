[project]
name = "your-virtual-env"
version = "0.1.0"
description = "Your Description"
authors = [{name = "Your Name", email = "you@example.com"}]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pymongo>=4.10.1",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.4",
    "uvicorn>=0.32.0",
    "boto3>=1.35.70",
    "botocore>=1.35.70",
    "voyageai>=0.3.2",
    "langchain-core>=0.3.81",
    "jsonschema>=4.25.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pytest>=8.0.0",
    "urllib3>=2.6.0",
    "starlette>=0.49.1",  # Security fix for CVE-2025-62727
    "aiohttp>=3.13.3",  # Security fix for CVE-2025-69223
    "filelock>=3.20.3",  # Security fix for CVE-2025-68146, CVE-2026-22701
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
