[project]
name = "payment-agent"
version = "0.1.0"
description = "Minimal agentic payment processing system using LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "langchain-aws>=0.2.0",
    "langgraph>=0.2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0.0",
    "pymongo>=4.5.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]