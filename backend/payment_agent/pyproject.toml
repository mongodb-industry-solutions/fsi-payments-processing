[project]
name = "payment-agent"
version = "0.1.0"
description = "Minimal agentic payment processing system using LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=1.2.5",
    "langchain-anthropic>=0.2.0",
    "langchain-aws>=0.2.0",
    "langgraph>=0.2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0.0",
    "pymongo>=4.5.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "voyageai>=0.3.0",
    "urllib3>=2.7.0",
    "aiohttp>=3.13.3",  # Security fix for CVE-2025-69223
    "filelock>=3.20.3",  # Security fix for CVE-2025-68146, CVE-2026-22701
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]