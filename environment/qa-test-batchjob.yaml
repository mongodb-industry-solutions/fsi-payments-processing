apiVersion: batch/v1
kind: Job
metadata:
  name: agentic-payments-qatest
  namespace: industrysolutions
  labels:
    app: agentic-payments-qatest
    purpose: qatest
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        sidecar.istio.io/inject: "true"
        app: agentic-payments-qatest
    spec:
      serviceAccountName: kanopy-staging-cicd-irsa
      restartPolicy: Never
      volumes:
        - name: reports
          emptyDir: {}

      # Native sidecar — runs alongside the main container,
      # auto-terminated when the main container exits
      initContainers:
        - name: report-uploader
          image: amazon/aws-cli:latest
          restartPolicy: Always        # ← THIS makes it a native sidecar
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Uploader waiting for report..."
              # Wait for the test container to signal completion
              while [ ! -f /reports/.done ]; do
                sleep 2
              done

              if [ -f /reports/results.json ]; then
                echo "Uploading results.json to S3..."
                aws s3 cp /reports/results.json "s3://ist-e2e-test-results/qa-test/agentic-payments/staging/$(date +%Y%m%d-%H%M%S)/results.json" --region us-east-1
                echo "✅ Upload complete"
              else
                echo "⚠️  No results.json found — nothing to upload"
                ls /reports/
              fi
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ist-qa-test-creds
                  key: ist-qa-s3-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ist-qa-test-creds
                  key: ist-qa-s3-secret-key
          volumeMounts:
            - name: reports
              mountPath: /reports
